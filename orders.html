<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">

        <aside class="sidebar">
            <h2 class="logo">AdminPro</h2>
            <ul class="menu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="users.html">Users</a></li>
                <li class="active"><a href="orders.html">Orders</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </aside>

        <main class="main">
            <header class="topbar">
                <input type="text" class="search" placeholder="Search...">
                <div class="profile">
                    <span class="notif">🔔</span>
                    <span class="username">Admin</span>
                </div>
            </header>

            <section class="page-header">
                <h1>Orders</h1>
                <button class="btn btn-primary">+ New Order</button>
            </section>

            <section class="filter-bar">
                <input type="text" class="search" placeholder="Search by order ID or customer...">
                <select class="filter-select">
                    <option value="">All Status</option>
                    <option>Completed</option>
                    <option>Pending</option>
                    <option>Cancelled</option>
                </select>
                <input type="date" class="filter-select">
            </section>

            <section class="table-box">
                <h3>All Orders</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#1001</td>
                            <td>Ali Khan</td>
                            <td>2026-11-01</td>
                            <td>$120</td>
                            <td><span class="badge done">Completed</span></td>
                            <td><button class="btn btn-edit">View</button></td>
                        </tr>
                        <tr>
                            <td>#1002</td>
                            <td>Sara Ahmed</td>
                            <td>2026-11-03</td>
                            <td>$85</td>
                            <td><span class="badge pending">Pending</span></td>
                            <td><button class="btn btn-edit">View</button></td>
                        </tr>
                        <tr>
                            <td>#1003</td>
                            <td>Usman Raza</td>
                            <td>2026-11-05</td>
                            <td>$240</td>
                            <td><span class="badge cancel">Cancelled</span></td>
                            <td><button class="btn btn-edit">View</button></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>

    </div>
</body>

</html>
