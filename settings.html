<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">

        <aside class="sidebar">
            <h2 class="logo">AdminPro</h2>
            <ul class="menu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li class="active"><a href="settings.html">Settings</a></li>
            </ul>
        </aside>

        <main class="main">
            <header class="topbar">
                <input type="text" class="search" placeholder="Search...">
                <div class="profile">
                    <span class="notif">🔔</span>
                    <span class="username">Admin</span>
                </div>
            </header>

            <section class="page-header">
                <h1>Settings</h1>
            </section>

            <section class="form-box">
                <h3>Profile Settings</h3>
                <form>
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="admin@example.com">
                    </div>

                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" placeholder="••••••••">
                    </div>

                    <div class="form-group">
                        <label for="lang">Language</label>
                        <select id="lang">
                            <option>English</option>
                            <option>Urdu</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="bio">Bio</label>
                        <textarea id="bio" rows="4" placeholder="Apne bare mein likhein..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="notify" checked>
                        <label for="notify">Email notifications on rakhein</label>
                    </div>

                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </form>
            </section>
        </main>

    </div>
</body>

</html>
