<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">

        <aside class="sidebar">
            <h2 class="logo">AdminPro</h2>
            <ul class="menu">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="products.html">Products</a></li>
                <li class="active"><a href="reports.html">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </aside>

        <main class="main">
            <header class="topbar">
                <input type="text" class="search" placeholder="Search...">
                <div class="profile">
                    <span class="notif">🔔</span>
                    <span class="username">Admin</span>
                </div>
            </header>

            <section class="page-header">
                <h1>Reports</h1>
                <button class="btn btn-primary">Download PDF</button>
            </section>

            <section class="stats">
                <div class="card">
                    <h4>Monthly Sales</h4>
                    <p class="number">$8,540</p>
                </div>
                <div class="card">
                    <h4>New Users</h4>
                    <p class="number">184</p>
                </div>
                <div class="card">
                    <h4>Returns</h4>
                    <p class="number">12</p>
                </div>
                <div class="card">
                    <h4>Growth</h4>
                    <p class="number">+14%</p>
                </div>
            </section>

            <section class="chart-row">
                <div class="chart-box">
                    <h3>Sales Overview</h3>
                    <div class="chart-placeholder">Line chart yahan aayega</div>
                </div>
                <div class="chart-box">
                    <h3>Top Categories</h3>
                    <div class="chart-placeholder">Pie chart yahan aayega</div>
                </div>
            </section>
        </main>

    </div>
</body>

</html>
